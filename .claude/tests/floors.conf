# Assertion floors for the harness's own suites.
#
#   <kind> | <suite> | <value>
#
# Read by scripts/selftest.sh, and by nothing else. The grammar is
# project.conf's on purpose, so that it is one vocabulary and not two:
# `#` comments and blank lines are ignored, fields are `|`-separated, and
# leading and trailing space is trimmed.
#
# THE VALUE IS THE EXECUTED ASSERTION COUNT, not the number of `assert_` call
# sites in the suite source. It is the `N` of summary()'s `<name>: N passed,
# M failed` line - read it off `bash scripts/selftest.sh <suite>`, never off
# `grep -c assert_`. The two disagree for most suites and wildly for some:
# `profiles` is ONE call site inside a loop and THIRTY-SEVEN executed
# assertions, and a floor of 1 would be satisfied by deleting 36 of them.
# `lib` is 50 call sites and 139 executed.
#
# It is a FLOOR, not an equality. A story that ADDS assertions to a suite need
# not touch this file; a story that removes them must, and must say why.
# Every suite in .claude/tests must appear here or the full run fails: a suite
# with no floor is a suite that can be emptied.
#
# The values below were measured from a full run of this repository at the
# commit that introduced this file, and confirmed against the CI run of the
# same tree. Raise one deliberately; never lower one to make a run pass.

# A FLOOR IS RECORDED TWICE. `.claude/tests/selftest.test.sh` carries a
# hand-copied table of these same numbers, so that a floor silently lowered
# to make a run pass is caught by a suite rather than by a reviewer. Raise
# one here and you MUST raise it there in the same commit, or the `selftest`
# suite fails with `and each records the executed count measured on this
# tree`. HARNESS-011 found that out the way everyone finds it out: on CI.
floor | boundaries    | 79
floor | ci-local      | 28
floor | classify      | 42
floor | doctor        | 29
floor | gate-reminder | 32
floor | gates         | 169
floor | grep-count    | 20
floor | lib           | 217
floor | mutate        | 44
floor | new-story     | 29
floor | phase         | 33
floor | phase-guard   | 300
floor | plan          | 42
floor | policy        | 17
floor | profiles      | 50
floor | refresh       | 122
floor | settings      | 20
floor | sigpipe       | 82
floor | worktree      | 73
floor | selftest      | 54

# HARNESS-010 raised two of them. The values are the count each suite will
# execute once the reconciled parser exists: lib 139 -> 197 (58 new assertions
# against write_candidates() directly) and phase-guard 188 -> 288 (100 new,
# drawn from the union corpus). They are recorded in RED, as AC-7 asks, which
# means BOTH suites sit below their floor until GREEN lands - RED's run measured
# lib 139 passed / 58 failed and phase-guard 241 passed / 47 failed. That is the
# story, not a defect: a floor written after the fact is a floor fitted to
# whatever shipped.

# HARNESS-011 raised two of them, in the RED commit that added the assertions.
# The values are the count each suite will execute once paths.conf carries the
# eight bare-directory rules: classify 27 -> 42 (15 new) and phase-guard
# 288 -> 300 (12 new). Measured, not estimated - RED's run of classify reports
# `32 passed, 10 failed`, which is 42 EXECUTED, and the same arithmetic holds
# for phase-guard, whose new block was run as a slice and reported
# `5 passed, 7 failed` against a prior 288.
#
# So BOTH suites sit below their floor until GREEN lands. That is the story,
# not a defect: a floor written after the fact is a floor fitted to whatever
# shipped.
#
# The count is the EXECUTED assertion count, never `grep -c assert_`. Neither
# new block loops, so call sites and executions coincide in them - but
# phase-guard as a whole DOES loop (three phases through one assert_ site),
# which is why the 300 is arithmetic on the suite's own summary line and not a
# count taken out of the source.

