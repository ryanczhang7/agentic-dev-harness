# Phase -> allowed write categories, enforced by .claude/hooks/phase-guard.sh
#
# Format:  <PHASE> | <comma-separated categories> | <message shown on denial>
#
# When no story is active (no .claude/state/current-story.env), the guard is
# OFF entirely — ad-hoc work is never blocked. The lock exists to protect the
# RED -> GREEN discipline while a story is genuinely in flight.

IDLE     | test,source,config,docs,harness | No active story; all writes allowed.
PLANNED  | docs,harness                    | Story is still being planned. Only the backlog and wiki may change. Move to RED with: bash scripts/phase.sh set <id> RED
RED      | test,docs,harness               | Story is in RED. Production code is frozen: write the failing test first, and let it fail for the right reason. Move to GREEN with: bash scripts/phase.sh set <id> GREEN
GREEN    | source,config,docs,harness      | Story is in GREEN. Tests are frozen: make the existing failing tests pass without changing them. If the tests are genuinely wrong, go back to RED rather than editing them here.
GATES    | source,config,docs,harness      | Story is in GATES. Tests are frozen: fix lint/type/build failures in production code. If a gate failure means a test is wrong, return to RED.
REVIEW   | docs,harness                    | Story is in REVIEW awaiting PR feedback. Only docs and backlog may change. Return to GREEN or GATES to make code changes.
SCAFFOLD | test,source,config,docs,harness | Bootstrap/chore story: scaffolding is unlocked by design.
DONE     | docs,harness                    | Story is DONE. Start a new story rather than editing code under a closed one.
