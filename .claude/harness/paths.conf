# Path classification for the phase guard.
#
# Format:  <category> | <glob>
# Categories: vendor | harness | docs | test | config | source
#
# A path is classified by the FIRST matching rule, top to bottom.
# Anything that matches nothing is classified as "source".
#
# Globs: ** matches any number of path segments, * matches within one segment.
# Paths are matched relative to the repository root, using forward slashes.
#
# Edit the `test` and `config` sections during the bootstrap story so they
# describe your actual stack. Leave `harness` and `docs` alone.

# --- Vendor: installed or generated, never authored -------------------------
# Must come FIRST: node_modules contains .md and *.test.js files that would
# otherwise be classified as docs or tests. Writable in every phase, because
# installing dependencies is never a phase violation.
vendor | **/node_modules/**
vendor | **/.venv/**
vendor | **/venv/**
vendor | **/__pycache__/**
vendor | **/.pytest_cache/**
vendor | **/.mypy_cache/**
vendor | **/.ruff_cache/**
vendor | **/.tox/**
vendor | target/**
vendor | **/dist/**
vendor | **/build/**
vendor | **/out/**
vendor | **/.next/**
vendor | **/.svelte-kit/**
vendor | **/.turbo/**
vendor | **/coverage/**
vendor | **/htmlcov/**
vendor | **/vendor/**
vendor | addons/**
vendor | .godot/**

# The directories themselves, so that `rm -rf node_modules` and friends are
# classified as vendor rather than falling through to source.
vendor | **/node_modules
vendor | **/.venv
vendor | **/venv
vendor | **/__pycache__
vendor | target
vendor | **/dist
vendor | **/build
vendor | **/out
vendor | **/coverage
vendor | **/htmlcov
vendor | **/vendor
vendor | addons
vendor | .godot

# --- Harness: agentic tooling, never ships to production images -------------
harness | .claude/**
harness | scripts/**
harness | .github/**
harness | CLAUDE.md
harness | .gitignore

# --- Docs: the wiki and the backlog ----------------------------------------
docs | docs/**
docs | README.md
docs | **/*.md

# --- Tests: written during RED, frozen during GREEN ------------------------
test | **/tests/**
test | **/test/**
test | **/__tests__/**
test | **/spec/**
test | **/test_*.*
test | **/*_test.*
test | **/*.test.*
test | **/*.spec.*
test | **/*Test.*
test | **/*Tests.*
test | **/conftest.py
test | **/jest.config.*
test | **/vitest.config.*
test | **/playwright.config.*
test | **/pytest.ini

# --- Config: build/dep/runtime configuration, owned by Feature Developer ---
config | package.json
config | package-lock.json
config | pnpm-lock.yaml
config | pyproject.toml
config | uv.lock
config | requirements*.txt
config | Cargo.toml
config | Cargo.lock
config | go.mod
config | go.sum
config | *.csproj
config | project.godot
config | export_presets.cfg
config | Dockerfile*
config | docker-compose*.yml
config | .dockerignore
config | tsconfig*.json
config | vite.config.*
config | next.config.*
config | tailwind.config.*
config | Makefile
config | justfile

# Everything else falls through to: source
