# Which model each phase of a story runs on. Read by `scripts/plan.sh`, which
# writes the plan into the story's `## Model guidance` before the phase starts.
#
# This file exists because the alternative is asking a human every time, and a
# question asked every time stops being answered and starts being habit.
# `rules.md` puts it more sharply: a model choice with no recorded verdict is
# folklore. A plan in a file with a reason per row is the opposite of folklore,
# and it is falsifiable - change a row, run the stories, see whether anything
# got worse.
#
# WHAT THE ROWS ARE BASED ON. One controlled measurement, recorded in
# `rules.md`: a partitioned RED brief on the weaker model produced sharper
# negative controls than the stronger model *without* one. The brief
# out-performed the model. So RED is the phase that can move - when the brief
# it depends on actually exists.
#
# The other direction is not symmetric, and that asymmetry is the whole design:
# the failure mode of a weaker model in GREEN or GATES is reaching green by
# weakening a test, which is the one thing this harness was built to prevent.
# A cheaper GREEN that deletes an assertion has not saved anything. Those rows
# do not move, and a story that wants them to should say so in its own
# `## Model guidance` with a success condition, not edit this file.
#
# THIS IS A PLAN, NOT A RECORD. The orchestrator still writes down the model
# each dispatch RESOLVED to, by name, because a session setting or an explicit
# override can beat both this file and the agent's own `model:` field, and
# nothing here can see which won.
#
# Format:
#   model  | <PHASE> | <agent>     | <model> | <why>
#   except | <PHASE> | <condition> | <model> | <why>
#
# Exceptions are consulted first and the first match wins. Conditions are
# evaluated against the story file:
#
#   type=<t>      the story's frontmatter `type`
#   no-contract   `## Contract` is empty or template-only
#   unenforced    every path the contract names is one the phase lock will not
#                 freeze. `harness` is in every phase's list in phases.conf, and
#                 `.claude/tests/*`, `scripts/*` and `.claude/hooks/*` all
#                 classify as `harness` - so a story maintaining the harness
#                 itself has RED able to write the mechanism and GREEN able to
#                 rewrite the frozen tests, with nothing to stop either. One
#                 source path is enough for the lock to bite, so this needs ALL
#                 of them.
#
# Models must be names that can actually be dispatched: opus, fable, sonnet,
# haiku. A typo here is not an error, it is a silent fall back to whatever the
# session was set to - which is the state this file replaces.

model  | PLANNED  | lead-po           | opus  | planning is the judgement phase: decomposition, the oracle partition, and what goes in the contract
model  | RED      | test-developer    | fable | the measured case. With a partitioned contract to work from, the brief carries the judgement and the weaker model writes sharper negative controls than the stronger one did without it
model  | GREEN    | feature-developer | opus  | the failure mode of a weaker model here is reaching green by weakening a test, which is the one thing this harness exists to prevent
model  | GATES    | feature-developer | opus  | same risk as GREEN, and a gate failure is where "make it stop complaining" is most tempting
model  | REVIEW   | lead-po           | opus  | reading review feedback against the contract is judgement, and a wrong call here ships
model  | SCAFFOLD | lead-po           | opus  | source, tests and config in one indivisible derivation, with no failing test in front of any of it

except | RED | no-contract    | opus  | what was measured was a partitioned BRIEF on the weaker model. With no contract to hand RED, the thing that was measured is absent, so this is not the case the evidence covers
except | RED | unenforced     | opus  | the lock freezes none of the paths this story names, so the contract is not an aid to the model here - it is the only enforcement there is. A weaker model against a safety net and a weaker model against nothing are different propositions
except | RED | type=bootstrap | opus  | a bootstrap story has no prior art to write tests against and derives the runner, the config and the scaffold together
