name: boundaries

# Defence in depth. The phase-guard hook enforces the RED/GREEN lock at write
# time inside a Claude Code session; this checks the same invariants on the diff,
# where the hook was never in the loop - a human commit, another tool, a
# force-push.

on:
  pull_request:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check agent boundaries and story hygiene
        run: bash scripts/check-boundaries.sh origin/${{ github.base_ref }}
